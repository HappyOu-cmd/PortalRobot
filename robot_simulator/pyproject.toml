[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-robot-modbus-simulator"
version = "0.1.0"
description = "INOVANCE SC-500 compatible Modbus TCP robot simulator for Portal Robot"
requires-python = ">=3.11"
dependencies = [
    "pymodbus==3.14.0",
    "PySide6==6.11.1",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[project.scripts]
portal-robot-simulator = "robot_simulator.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["robot_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
